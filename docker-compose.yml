# Local dev: `docker compose up -d db` then `npm run migrate`.
# Production (Oracle Ampere, arm64): `docker compose --profile app up -d --build`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gofrommunich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gofrommunich}
      POSTGRES_DB: gofrommunich
    ports:
      - "5433:5432"   # 5432 is taken by the host's own Postgres in dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gofrommunich"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://gofrommunich:${POSTGRES_PASSWORD:-gofrommunich}@db:5432/gofrommunich
    ports:
      - "8080:8080"
    volumes:
      - models:/app/models
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    command: ["sh", "-c", "npx tsx packages/db/src/migrate.ts && npx tsx apps/worker/src/cli.ts run"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://gofrommunich:${POSTGRES_PASSWORD:-gofrommunich}@db:5432/gofrommunich
    volumes:
      - models:/app/models
      - training:/app/data
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  models:
  training:
